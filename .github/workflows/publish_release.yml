name: Publish release

on:
  workflow_dispatch:
    inputs:
      private_release:
        description: 'Set true to publish a private release with a 4th version section (A.B.C.D)'
        required: false
        type: boolean
        default: false
      private_release_number:
        description: '4th section value (D) for private release version A.B.C.D'
        required: false
        type: string

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.3'
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.3'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'
      - name: Set version env variable
        run: |
          BASE_VERSION=$(./gradlew properties | grep ^version: | cut -d\  -f2 | sed 's@-SNAPSHOT@@')
          PRIVATE_RELEASE="${{ github.event.inputs.private_release }}"
          PRIVATE_RELEASE_NUMBER="${{ github.event.inputs.private_release_number }}"

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected base version in A.B.C format, found: $BASE_VERSION"
            exit 1
          fi

          if [[ "$PRIVATE_RELEASE" == "true" ]]; then
            if [[ -z "$PRIVATE_RELEASE_NUMBER" || ! "$PRIVATE_RELEASE_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "For private releases, provide a numeric private_release_number (D in A.B.C.D)."
              exit 1
            fi
            VERSION="${BASE_VERSION}.${PRIVATE_RELEASE_NUMBER}"
          else
            VERSION="${BASE_VERSION}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Generated invalid release version: $VERSION"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PRIVATE_RELEASE=${PRIVATE_RELEASE}" >> $GITHUB_ENV
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Publish artifact
        env:
          publishUser: ${{ secrets.BALLERINA_BOT_USERNAME }}
          publishPAT: ${{ secrets.BALLERINA_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: |
          git config user.name ${{ secrets.BALLERINA_BOT_USERNAME }}
          git config user.email ${{ secrets.BALLERINA_BOT_EMAIL }}
          git checkout -b release-${VERSION}
          ./gradlew build -x :jballerina-debugger-integration-test:test -Pversion=${VERSION}
          ./gradlew -Pversion=${VERSION} publish -x test --continue
      - name: Create Release Tag
        run: |
          git config --local user.name ${{ secrets.BALLERINA_BOT_USERNAME }}
          git config --local user.email ${{ secrets.BALLERINA_BOT_EMAIL }}
          git tag -a v${VERSION} -m "Release v${VERSION}"
          git push origin v${VERSION}
        env:
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
      - name: Create Github release from the release tag
        run: |
          if [[ "$PRIVATE_RELEASE" == "true" ]]; then
            curl --request POST 'https://api.github.com/repos/ballerina-platform/ballerina-lang/releases' \
            --header 'Accept: application/vnd.github.v3+json' \
            --header 'Authorization: Bearer ${{ secrets.BALLERINA_BOT_TOKEN }}' \
            --header 'Content-Type: application/json' \
            --data-raw '{
                "tag_name": "v'"$VERSION"'",
                "name": "ballerina-lang-v'"$VERSION"'",
                "prerelease": true
            }'
          else
            curl --request POST 'https://api.github.com/repos/ballerina-platform/ballerina-lang/releases' \
            --header 'Accept: application/vnd.github.v3+json' \
            --header 'Authorization: Bearer ${{ secrets.BALLERINA_BOT_TOKEN }}' \
            --header 'Content-Type: application/json' \
            --data-raw '{
                "tag_name": "v'"$VERSION"'",
                "name": "ballerina-lang-v'"$VERSION"'"
            }'
          fi
      - name: Post release PR
        env:
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: |
          curl -fsSL https://github.com/github/hub/raw/master/script/get | bash -s 2.14.1
          bin/hub pull-request -m "[Automated] Sync master after "$VERSION" release"
