name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.3'
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.3'
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'
      - name: Set version env variable
        run: |
          echo "VERSION=$(./gradlew properties | grep ^version: | cut -d\  -f2 | sed 's@-SNAPSHOT@@')" >> $GITHUB_ENV
          echo "BASE_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build artifacts
        env:
          publishUser: ${{ github.actor }}
          publishPAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com
          git checkout -b release-${VERSION}
          sed -i "s/^version=.*/version=${VERSION}/" gradle.properties
          git add gradle.properties
          git commit -m "[Automated] Prepare release ${VERSION}"
          git push -u origin release-${VERSION}
          ./gradlew build -x check -x test -x :jballerina-debugger-integration-test:test -Pversion=${VERSION}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'rootfs'
          scan-ref: '${{ github.workspace }}/distribution/zip/jballerina-tools'
          format: 'table'
          timeout: '10m0s'
          exit-code: '1'
      - name: Publish artifact
        env:
          publishUser: ${{ github.actor }}
          publishPAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -Pversion=${VERSION} publish -x test --continue
      - name: Create Release Tag
        run: |
          git config --local user.name ${{ github.actor }}
          git config --local user.email ${{ github.actor }}@users.noreply.github.com
          git tag -a v${VERSION} -m "Release v${VERSION}"
          git push origin v${VERSION}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Github release from the release tag
        run: |
          curl --request POST 'https://api.github.com/repos/wso2-enterprise/support-ballerina-lang/releases' \
          --header 'Accept: application/vnd.github.v3+json' \
          --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
          --header 'Content-Type: application/json' \
          --data-raw '{
              "tag_name": "v'"$VERSION"'",
              "name": "ballerina-lang-v'"$VERSION"'"
          }'
      - name: Post release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://github.com/github/hub/raw/master/script/get | bash -s 2.14.1
          bin/hub pull-request -b ${BASE_BRANCH} -h release-${VERSION} -m "[Automated] Sync ${BASE_BRANCH} after ${VERSION} release"
